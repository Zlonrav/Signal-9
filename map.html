<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="js/auth.js"></script> 
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>СИГНАЛ-9 // ТОПОЛОГИЯ СТАНЦИИ</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        /* --- СПЕЦИФИЧНЫЕ СТИЛИ ДЛЯ КАРТЫ --- */
        body.tools-page { overflow: hidden; height: 100vh; background-color: #010306; }
        #display { display: flex !important; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }

        .map-header {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px;
            color: var(--neon); text-transform: uppercase; opacity: 0.6;
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        .map-container { position: relative; width: 1200px; height: 850px; }
        .map-container::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; background-position: center center;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            pointer-events: none;
        }

        .connections-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .link-bg { stroke: rgba(0, 242, 255, 0.05); stroke-width: 2px; transition: 0.3s; }
        .link-flow { stroke: var(--neon); stroke-width: 2px; stroke-dasharray: 8 16; filter: drop-shadow(0 0 5px var(--neon)); animation: flow 20s linear infinite; transition: 0.3s;}
        .link-locked .link-bg { stroke: rgba(255, 255, 255, 0.05); stroke-dasharray: 4 4; }
        .link-locked .link-flow { stroke: none; }
        @keyframes flow { to { stroke-dashoffset: -1000; } }

        /* --- УЗЛЫ --- */
        .map-node {
            position: absolute; width: 130px; height: 130px;
            background: rgba(2, 10, 15, 0.85); border: 1px solid rgba(0, 242, 255, 0.15);
            text-decoration: none; z-index: 10; transform: translate(-50%, -50%);
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1); backdrop-filter: blur(8px); box-sizing: border-box;
        }

        .map-node::before, .map-node::after { content: ''; position: absolute; width: 10px; height: 10px; pointer-events: none; transition: 0.3s; }
        .map-node.unlocked::before { top: -1px; left: -1px; border-top: 2px solid var(--neon); border-left: 2px solid var(--neon); }
        .map-node.unlocked::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--neon); border-right: 2px solid var(--neon); }
        .map-node.unlocked:hover { background: rgba(0, 242, 255, 0.1); box-shadow: 0 0 30px rgba(0, 242, 255, 0.2), inset 0 0 20px rgba(0, 242, 255, 0.1); transform: translate(-50%, -50%) scale(1.05); }
        .map-node.unlocked:hover::before, .map-node.unlocked:hover::after { width: 100%; height: 100%; opacity: 0.3; }

        .node-glyph { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .node-glyph svg { width: 100%; height: 100%; overflow: visible; }
        .map-node.unlocked .node-glyph path { stroke: var(--neon); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px var(--neon)) drop-shadow(0 0 1px #fff); transition: 0.3s; }
        .map-node.unlocked:hover .node-glyph path { stroke-width: 3; filter: drop-shadow(0 0 8px var(--neon)) drop-shadow(0 0 2px #fff); }

        .node-title { position: absolute; top: 70%; left: 50%; transform: translate(-50%, -50%); width: 100%; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--neon); font-family: 'JetBrains Mono', monospace; text-align: center; font-weight: bold; line-height: 1.3; pointer-events: none; transition: 0.3s; text-shadow: 0 0 8px rgba(0, 242, 255, 0.5); }
        .node-status { position: absolute; bottom: 8px; width: 100%; text-align: center; font-size: 8px; font-family: monospace; letter-spacing: 2px; font-weight: bold; }

        /* --- OFFLINE УЗЛЫ --- */
        .map-node.locked { border-color: rgba(150, 150, 150, 0.2); cursor: not-allowed; background: rgba(10, 10, 10, 0.85); }
        .map-node.locked::before { top: -1px; left: -1px; border-top: 2px solid #666; border-left: 2px solid #666; }
        .map-node.locked::after { bottom: -1px; right: -1px; border-bottom: 2px solid #666; border-right: 2px solid #666; }
        .map-node.locked .node-glyph path { stroke: #555; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: none; }
        .map-node.locked .node-title { color: #888; text-shadow: none; }
        .map-node.locked .node-status { color: #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        .map-node.unlocked .node-status { color: #00ff44; text-shadow: 0 0 5px rgba(0, 255, 68, 0.5); }

        /* --- УЗЕЛ С ОШИБКОЙ (АРХИВ) --- */
        .map-node.error-node { border-color: rgba(255, 51, 51, 0.5); background: rgba(15, 2, 2, 0.85); cursor: pointer; }
        .map-node.error-node::before { top: -1px; left: -1px; border-top: 2px solid #ff3333; border-left: 2px solid #ff3333; }
        .map-node.error-node::after { bottom: -1px; right: -1px; border-bottom: 2px solid #ff3333; border-right: 2px solid #ff3333; }
        .map-node.error-node .node-glyph path { stroke: #ff3333; filter: drop-shadow(0 0 5px #ff3333); }
        .map-node.error-node .node-title { color: #ff6666; text-shadow: 0 0 5px #ff3333; }
        .map-node.error-node .node-status { color: #ff3333; animation: blink 1s infinite; }
		
		 /* --- УЗЕЛ С ПРЕДУПРЕЖДЕНИЕМ (ЯДРО) --- */
        .map-node.warning-node { border-color: rgba(255, 170, 0, 0.5); background: rgba(15, 10, 2, 0.85); cursor: pointer; }
        .map-node.warning-node::before { top: -1px; left: -1px; border-top: 2px solid #ffaa00; border-left: 2px solid #ffaa00; }
        .map-node.warning-node::after { bottom: -1px; right: -1px; border-bottom: 2px solid #ffaa00; border-right: 2px solid #ffaa00; }
        .map-node.warning-node .node-glyph path { stroke: #ffaa00; filter: drop-shadow(0 0 5px #ffaa00); }
        .map-node.warning-node .node-title { color: #ffaa00; text-shadow: 0 0 5px #ffaa00; }
        .map-node.warning-node .node-status { color: #ffaa00; animation: blink 1s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .map-node[data-id="hub"] { width: 150px; height: 150px; border-color: rgba(0, 242, 255, 0.4); box-shadow: 0 0 40px rgba(0, 242, 255, 0.1); }
        .map-node[data-id="hub"] .node-glyph { width: 38px; height: 38px; }
        /* Запрещаем курсор-руку для заблокированных, даже если они ERROR */
        .map-node.no-pointer {
            cursor: not-allowed !important;
        }
        /* Стили для аварийной линии (к узлу с ошибкой) */
        .link-error .link-bg { 
            stroke: rgba(255, 51, 51, 0.3); 
            stroke-dasharray: 4 4; 
        }
        .link-error .link-flow { 
            stroke: #ff3333; 
            stroke-dasharray: 8 16; 
            filter: drop-shadow(0 0 5px #ff3333); 
            animation: flow 20s linear infinite; 
        }
        .link-active .link-bg { stroke: rgba(0, 242, 255, 0.2); }
        .link-active .link-flow { stroke: var(--neon); filter: drop-shadow(0 0 6px var(--neon)); }
		        /* Тонкий декоративный прямоугольник рядом с Телеметрией */
        .decor-rect {
            position: absolute;
            width: 14px;
            height: 130px; /* Высота как у узлов */
            background: rgba(2, 10, 15, 0.85);
            border: 1px solid rgba(0, 242, 255, 0.15);
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none; /* Чтобы не мешал кликам */
        }

        /* Внутренние полоски для "технологичного" вида */
        .decor-rect::before {
            content: '';
            position: absolute;
            top: 10px; bottom: 10px; left: 3px; right: 3px;
            background: repeating-linear-gradient(
                0deg, 
                rgba(0, 242, 255, 0.2), 
                rgba(0, 242, 255, 0.2) 2px, 
                transparent 2px, 
                transparent 6px
            );
        }
    </style>
</head>
<body class="tools-page">

    <div class="chat-system">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="map-header">СИСТЕМА ТОПОЛОГИИ // СЕКТОР 07</div>

    <div id="display">
        <div class="map-container" id="mapContainer">
            <svg class="connections-layer" id="mapLines"></svg>
            <div id="mapNodes"></div>
        </div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="
        position: fixed; bottom: 25px; right: 25px; z-index: 1000; 
        background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); 
        color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; 
        cursor: pointer; transition: 0.3s;
    " onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">
        &gt;_
    </button>

    <script src="js/loader.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
