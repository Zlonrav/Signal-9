<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИГНАЛ-9 // ЭНЕРГОЯДРО</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        :root { 
            --warn: #ffaa00; 
            --ok: #00ff44; 
            --err: #ff3333; 
        }
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
            background-image: radial-gradient(circle at center, #03101a 0%, #010306 100%);
            font-family: 'JetBrains Mono', monospace;
        }

        .core-header { 
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px; 
            color: var(--neon); text-transform: uppercase; opacity: 0.6; 
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        .terminal-wrapper {
            position: relative; width: 600px; height: 500px;
            background: #000; border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0,0,0,1);
            border-radius: 4px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden; z-index: 10;
            margin-top: 50px;
        }

        .terminal-wrapper::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .corner { 
            position: absolute; width: 25px; height: 25px; border: 2px solid #00f2ff;
            z-index: 20; pointer-events: none; opacity: 1; filter: drop-shadow(0 0 5px #00f2ff);
        }
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .main-layout {
            display: flex; gap: 25px; align-items: center; justify-content: center;
            width: 100%; height: 100%; padding: 20px; box-sizing: border-box; z-index: 5;
        }

        /* --- РЕАКТОР --- */
        .core-wrapper { 
            width: 320px; height: 380px; 
            display: flex; align-items: center; justify-content: center; 
            perspective: 1000px; 
            flex-shrink: 0; 
            position: relative;
            transform-style: preserve-3d; 
        }

        .reactor-core {
            width: 120px; height: 120px;
            background: radial-gradient(circle, #fff 0%, #00f2ff 30%, #0066ff 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px #00f2ff, 0 0 100px #0066ff, inset 0 0 30px #fff;
            position: relative; 
            z-index: 10;
            transform: translateZ(0); 
            animation: corePulse 2s infinite alternate ease-in-out;
        }

        .reactor-core.critical {
            background: radial-gradient(circle, #fff 0%, #ffaa00 30%, #ff3333 70%, transparent 100%);
            box-shadow: 0 0 50px #ffaa00, 0 0 100px #ff3333, inset 0 0 30px #fff;
            animation: coreCritical 0.5s infinite alternate ease-in-out;
        }

        .containment-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(0, 242, 255, 0.4);
            top: 50%; left: 50%;
            z-index: 5;
            transform-style: preserve-3d;
        }

        .ring-1 { 
            width: 220px; height: 220px; 
            transform: translate(-50%, -50%) translateZ(-20px) rotateX(70deg) rotateZ(10deg); 
            animation: spinRing1 10s linear infinite; 
            border-color: rgba(0, 242, 255, 0.6); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); 
        }
        .ring-2 { 
            width: 280px; height: 280px; 
            transform: translate(-50%, -50%) translateZ(-40px) rotateX(70deg) rotateY(30deg) rotateZ(-10deg); 
            animation: spinRing2 15s linear infinite; 
            border-color: rgba(0, 170, 255, 0.4); 
        }
        .ring-3 { 
            width: 160px; height: 160px; 
            transform: translate(-50%, -50%) translateZ(-10px) rotateX(70deg) rotateY(-30deg) rotateZ(0deg); 
            animation: spinRing3 7s linear infinite; 
            border-style: solid; border-color: rgba(255, 51, 51, 0.3); 
        }

        .energy-particles {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 15;
        }
        .particle {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px #00f2ff;
            animation: shootOut 2s infinite linear;
        }

        @keyframes corePulse {
            0% { transform: translateZ(0) scale(0.95); filter: brightness(0.8); }
            100% { transform: translateZ(0) scale(1.05); filter: brightness(1.2); }
        }
        @keyframes coreCritical {
            0% { transform: translateZ(0) scale(0.9); filter: brightness(1); }
            100% { transform: translateZ(0) scale(1.1); filter: brightness(1.5); }
        }
        @keyframes spinRing1 { 0% { transform: translate(-50%, -50%) translateZ(-20px) rotateX(70deg) rotateZ(10deg); } 100% { transform: translate(-50%, -50%) translateZ(-20px) rotateX(70deg) rotateZ(370deg); } }
        @keyframes spinRing2 { 0% { transform: translate(-50%, -50%) translateZ(-40px) rotateX(70deg) rotateY(30deg) rotateZ(-10deg); } 100% { transform: translate(-50%, -50%) translateZ(-40px) rotateX(70deg) rotateY(30deg) rotateZ(-370deg); } }
        @keyframes spinRing3 { 0% { transform: translate(-50%, -50%) translateZ(-10px) rotateX(70deg) rotateY(-30deg) rotateZ(0deg); } 100% { transform: translate(-50%, -50%) translateZ(-10px) rotateX(70deg) rotateY(-30deg) rotateZ(360deg); } }
        @keyframes shootOut {
            0% { transform: translate(-50%, -50%) rotate(0deg) translateX(60px) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(360deg) translateX(150px) scale(0); opacity: 0; }
        }

        /* --- МОНИТОРИНГ --- */
        .monitor-panel { width: 200px; height: 380px; display: flex; flex-direction: column; gap: 15px; }
        .sys-stats { display: flex; flex-direction: column; gap: 12px; }
        .stat-row { display: flex; flex-direction: column; gap: 4px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; }
        .stat-label span:last-child { color: var(--neon); font-weight: bold; }
        
        .progress-bar { width: 100%; height: 6px; background: rgba(0, 242, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.2); }
        .progress-fill { height: 100%; background: #00f2ff; box-shadow: 0 0 10px #00f2ff; width: 0%; transition: width 0.5s ease-out; }
        .progress-fill.warn { background: var(--warn) !important; box-shadow: 0 0 10px var(--warn) !important; }
        .progress-fill.err { background: var(--err) !important; box-shadow: 0 0 10px var(--err) !important; }

        .log-box { 
            flex-grow: 1; background: rgba(0, 10, 15, 0.8); border: 1px solid rgba(0, 242, 255, 0.3); 
            padding: 8px; overflow: hidden; display: flex; flex-direction: column; 
            justify-content: flex-end; border-left: 2px solid #00f2ff; 
        }
        .log-line { 
            color: #aaa; font-size: 9.5px; line-height: 1.4; margin-bottom: 2px; 
            flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        .log-line.ok { color: var(--ok); }
        .log-line.err { color: var(--err); }
        .log-line.warn { color: var(--warn); }
    </style>
</head>
<body class="tools-page">

    <div class="chat-system">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="core-header">ЭНЕРГОЯДРО // СЕКТОР 00</div>
    
    <div class="terminal-wrapper">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="main-layout">
            <div class="core-wrapper">
                <div class="containment-ring ring-1"></div>
                <div class="containment-ring ring-2"></div>
                <div class="containment-ring ring-3"></div>
                
                <div class="reactor-core" id="reactorCore"></div>
                <div class="energy-particles" id="particles"></div>
            </div>

            <div class="monitor-panel">
                <div class="sys-stats">
                    <div class="stat-row">
                        <div class="stat-label"><span>ТЕМПЕРАТУРА</span><span id="valTemp">98%</span></div>
                        <div class="progress-bar"><div class="progress-fill err" id="barTemp" style="width: 98%;"></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-label"><span>ВЫРАБОТКА</span><span id="valOut">98%</span></div>
                        <div class="progress-bar"><div class="progress-fill" id="barOut" style="width: 98%;"></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-label"><span>СТАБИЛЬНОСТЬ</span><span id="valStab" style="color: var(--err);">5%</span></div>
                        <div class="progress-bar"><div class="progress-fill err" id="barStab" style="width: 5%;"></div></div>
                    </div>
                </div>

                <div class="log-box" id="logBox">
                    <div class="log-line ok">> CORE MONITOR: ONLINE</div>
                    <div class="log-line err">> CRITICAL: OVERHEATING</div>
                </div>
            </div>
        </div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="position: fixed; bottom: 25px; right: 25px; z-index: 100000; background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">&gt;_</button>

    <script src="js/loader.js"></script>
        <script src="js/reactor.js"></script>
</body>
</html>
