<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="js/auth.js"></script> 
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>СИГНАЛ-9 // АРХИВ</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        /* Стили для Архива */
        body.tools-page { overflow-y: auto !important; height: auto !important; min-height: 100vh; }
        #display { display: flex !important; flex-direction: column; align-items: center; padding: 80px 0 40px 0; height: auto; }
        
        .archive-header {
            display: flex; gap: 20px; margin-bottom: 30px; z-index: 100;
        }
        
        .page-tab {
            background: transparent; border: 1px solid rgba(0, 242, 255, 0.3);
            color: var(--neon); padding: 10px 20px; cursor: pointer;
            font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; transition: 0.3s;
        }
        .page-tab.active { background: rgba(0, 242, 255, 0.1); border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        .archive-grid {
            display: grid; 
            grid-template-columns: repeat(5, 110px); /* Увеличили ширину ячейки до 110px */
            gap: 20px; /* Чуть больше отступа */
            justify-content: center; 
            width: 100%; 
            max-width: 700px; /* Увеличили общую ширину сетки */
            margin-bottom: 30px;
            position: relative; 
            min-height: 400px;
        }

        .glyph-cell {
            width: 110px; /* Размер плитки */
            height: 110px; 
            background: rgba(2, 10, 15, 0.85);
            border: 1px solid rgba(0, 242, 255, 0.2); 
            border-radius: 8px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            position: relative; 
            transition: all 0.5s ease;
            padding-bottom: 20px; /* Оставляем место для текста */
            box-sizing: border-box;
        }
        
        /* Анимация исчезновения для верификации */
        .glyph-cell.dissolving { opacity: 0; transform: scale(0.5) rotate(45deg); filter: blur(5px); }

        .glyph-svg { 
            width: 55px; /* Увеличили сам глиф */
            height: 55px; 
            filter: drop-shadow(0 0 5px var(--neon)); 
        }
        .glyph-label { 
            font-size: 10px; /* Увеличили шрифт */
            color: var(--neon); 
            font-family: 'JetBrains Mono', monospace; 
            letter-spacing: 1px; 
            position: absolute;
            bottom: 8px; /* Прижали к низу */
            width: 90%;
            text-align: center;
            white-space: nowrap; /* Запрещаем перенос строк */
            overflow: hidden; /* Если слово слишком длинное — обрежем */
            text-overflow: ellipsis; /* Добавим троеточие */
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0, 242, 255, 0.5);
        }

        .empty-slot { border: 1px dashed rgba(255, 255, 255, 0.05); background: transparent; }
        .empty-slot::after { content: 'EMPTY'; font-size: 6px; color: rgba(255,255,255,0.1); }

        /* Пагинация (для будущего, если понадобится > 25 глифов на странице) */
        .pagination { display: flex; gap: 20px; z-index: 100; margin-top: 20px; }
        .pagination button {
            background: transparent; border: 1px solid rgba(0,242,255,0.3); color: var(--neon);
            padding: 5px 15px; font-family: monospace; cursor: pointer; transition: 0.3s;
        }
        .pagination button:hover { background: rgba(0,242,255,0.1); border-color: var(--neon); }
        .pagination button:disabled { opacity: 0.2; cursor: not-allowed; }

        /* Ошибка в архиве */
        .error-screen {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: rgba(0,0,0,0.8);
            border: 1px solid #ff3333; z-index: 50; box-shadow: 0 0 30px rgba(255,51,51,0.3);
        }
        .error-text { color: #ff3333; font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 2px; text-align: center; line-height: 1.5; }
        
        @keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .error-text { animation: pulseRed 2s infinite; }
    </style>
</head>
<body class="tools-page">
    <!-- ТЕЛЕМЕТРИЯ -->
    <div class="telemetry-panel" style="
        position: fixed; 
        top: 25px; 
        left: 25px; 
        z-index: 1000; 
        background: rgba(0, 0, 0, 0.5); 
        padding: 10px 15px; 
        border-left: 2px solid var(--neon);
        display: flex;
        align-items: center;
        gap: 10px;
    ">
        <svg width="25" height="25" viewBox="0 0 100 100" style="stroke: var(--neon); fill: none; flex-shrink: 0;">
            <path d="M10 10 L30 10 M10 10 L10 30 M90 90 L70 90 M90 90 L90 70 M50 10 L50 90 M10 50 L90 50" stroke-width="4"></path>
        </svg>
        <span id="timer" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--neon); letter-spacing: 2px;">ПРИЁМ СИГНАЛА: ...</span>
    </div>
    <div class="chat-system">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div id="display">
        <!-- Вкладки -->
        <div class="archive-header" id="archiveTabs" style="display: none;">
            <button class="page-tab active" onclick="switchArchivePage(1)">БУФЕР ДЕКОДИРОВАНИЯ</button>
            <button class="page-tab" onclick="switchArchivePage(2)">СЕКТОР ВЕРИФИКАЦИИ</button>
        </div>

        <!-- Сетка -->
        <div class="archive-grid" id="archiveGrid">
            <!-- Сюда JS вставит ячейки -->
        </div>
        
        <!-- Кнопка ошибки (если Архив не починен) -->
        <div id="archiveErrorScreen" class="error-screen" style="display: none;">
            <div class="error-text">
                ОШИБКА БУФЕРА<br>
                АВТОСОХРАНЕНИЕ ОТКЛЮЧЕНО<br>
                <span style="font-size: 10px; opacity: 0.7;">ТРЕБУЕТСЯ РУЧНАЯ КАЛИБРОВКА (СМ. ЖУРНАЛ)</span>
            </div>
        </div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="
        position: fixed; bottom: 25px; right: 25px; z-index: 1000; 
        background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); 
        color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; 
        cursor: pointer; transition: 0.3s;
    " onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">
        &gt;_
    </button>

    <script src="js/loader.js"></script>
    <script src="js/archive.js"></script>
</body>
</html>
