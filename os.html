<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИГНАЛ-9 // ОПЕРАЦИОННАЯ СИСТЕМА</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
            background-image: radial-gradient(circle at center, #03101a 0%, #010306 100%);
        }

        .chat-system { display: none !important; }

        .os-header { 
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px; 
            color: var(--neon); text-transform: uppercase; opacity: 0.6; 
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        /* --- ЕДИНЫЙ ТЕРМИНАЛ (АДАПТИВНЫЙ) --- */
        .terminal-wrapper {
            position: relative; width: 90%; max-width: 1000px; height: 85vh; max-height: 700px;
            background: #000; border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0,0,0,1);
            border-radius: 4px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden; z-index: 10;
        }

        .terminal-wrapper::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* --- ИДЕАЛЬНЫЕ УГОЛКИ --- */
        .corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--neon); z-index: 10; pointer-events: none; opacity: 0.8; }
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .terminal-hint {
            position: absolute; bottom: 10px; right: 15px;
            color: #555; font-size: 10px; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace;
            z-index: 100;
        }

        #os-lockdown {
            position: absolute; inset: 0; z-index: 20; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease; background: transparent;
        }
        #os-lockdown.hidden { opacity: 0; pointer-events: none; }

        .captcha-box { text-align: center; width: 100%; }
        .captcha-box h2 { color: var(--neon); font-family: 'Michroma', sans-serif; font-size: 16px; margin-bottom: 20px; text-shadow: 0 0 10px var(--neon); }
        .captcha-box p { color: #aaa; font-size: 12px; margin-bottom: 15px; line-height: 1.5; }
        
        input#captcha-input.terminal-input {
            background: transparent !important; border: none !important; border-bottom: 2px solid var(--neon) !important;
            color: var(--neon) !important; font-family: 'JetBrains Mono', monospace !important; font-size: 24px !important;
            text-align: center !important; outline: none !important; padding: 10px !important; width: 300px !important;
            letter-spacing: 4px !important; transition: border-color 0.2s, box-shadow 0.2s !important;
            margin: 15px auto 0 !important; display: block !important;
            position: static !important; box-shadow: none;
        }
        
        input#captcha-input.terminal-input:focus { 
            border-bottom-color: var(--neon) !important; 
            box-shadow: 0 5px 10px -5px var(--neon) !important; 
        }

        /* --- АДАПТИВНАЯ СЕТКА КУБИТОВ --- */
        .os-container {
            position: relative; width: 80%; max-width: 400px; aspect-ratio: 1 / 1;
            z-index: 10; display: flex; align-items: center; justify-content: center;
        }

        #tracesLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }

        .qubit-grid {
            position: relative; z-index: 5; display: grid;
            grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
            gap: 3%; width: 100%; height: 100%; perspective: 1000px;
        }

        .qubit {
            width: 100%; height: 100%; background: rgba(2, 10, 15, 0.85);
            border: 1px solid rgba(0, 242, 255, 0.3); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; position: relative;
            transform: rotateX(10deg) rotateY(-10deg);
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5); animation: pulseBorder 3s infinite alternate; 
        }

        .qubit.active { border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2), 2px 2px 10px rgba(0,0,0,0.5); }
        .qubit.active::after {
            content: ''; position: absolute; width: 30%; height: 30%;
            border: 2px solid var(--neon); border-radius: 50%;
            animation-name: pulse; animation-duration: 2s; animation-iteration-count: infinite;
            animation-timing-function: ease-in-out; animation-delay: var(--anim-delay, 0s); 
        }

        .qubit.broken { 
            border-color: #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.2), 2px 2px 10px rgba(0,0,0,0.5); 
            animation: shake 1.5s infinite; background: rgba(15, 2, 2, 0.85);
        }
        .qubit.broken::after { content: 'ERR'; color: #ff3333; font-weight: bold; font-size: 12px; border: none; animation: none; width: auto; height: auto; }

        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0; } 20% { transform: scale(1); opacity: 1; } 80% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes pulseBorder { 0% { border-color: rgba(0, 242, 255, 0.3); } 100% { border-color: rgba(0, 242, 255, 0.8); } }
        @keyframes shake { 0% { transform: rotateX(10deg) rotateY(-10deg) translate(1px, 1px); } 20% { transform: rotateX(10deg) rotateY(-10deg) translate(-1px, -1px); } 40% { transform: rotateX(10deg) rotateY(-10deg) translate(1px, 1px); } 60% { transform: rotateX(10deg) rotateY(-10deg) translate(-1px, 1px); } 80% { transform: rotateX(10deg) rotateY(-10deg) translate(1px, -1px); } 100% { transform: rotateX(10deg) rotateY(-10deg) translate(1px, 1px); } }
        @keyframes flow { to { stroke-dashoffset: -100; } }
    </style>
</head>
<body class="tools-page">

    <div class="chat-system" style="display: none;">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="os-header">ОПЕРАЦИОННАЯ СИСТЕМА // СЕКТОР 01</div>
    
    <div class="terminal-wrapper">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div id="os-lockdown">
            <div class="captcha-box">
                <h2>ВЕРИФИКАЦИЯ ЦЕЛОСТНОСТИ</h2>
                <p>ОБНАРУЖЕН ВНЕШНИЙ ЗАПРОС. ДЛЯ ДОСТУПА К ЯДРУ ВВЕДИТЕ ВАШ УНИКАЛЬНЫЙ ИДЕНТИФИКАТОР.</p>
                <p>ПОЛУЧИТЕ ЕГО В КОНСОЛИ КОМАНДОЙ <span class="cmd-text">self --id</span></p>
                <input type="text" id="captcha-input" class="terminal-input" autocomplete="off" spellcheck="false" placeholder="0x...">
            </div>
        </div>

        <div class="os-container">
            <svg id="tracesLayer"></svg>
            <div class="qubit-grid" id="qubitGrid"></div>
        </div>
        
        <div class="terminal-hint" id="os-hint">[ENTER] - ВЫПОЛНИТЬ</div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="position: fixed; bottom: 25px; right: 25px; z-index: 100000; background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">&gt;_</button>

    <script src="js/loader.js"></script>
    <script src="js/os.js"></script>
</body>
</html>
