<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="js/auth.js"></script> 
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>СИГНАЛ-9 // ОПЕРАЦИОННАЯ СИСТЕМА</title>
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    
    <style>
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
        }

        .os-header { 
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px; 
            color: var(--neon); text-transform: uppercase; opacity: 0.6; 
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        .os-container {
            position: relative;
            width: 400px; 
            height: 400px;
            z-index: 10;
        }

        #tracesLayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .qubit-grid {
            position: relative;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(5, 70px);
            grid-template-rows: repeat(5, 70px);
            gap: 15px;
        }

        .qubit {
            width: 70px; height: 70px;
            background: rgba(2, 10, 15, 0.85);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px; 
            color: var(--neon);
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            animation: pulseBorder 3s infinite alternate; 
        }

        .qubit.active { 
            border-color: var(--neon); 
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2), 2px 2px 10px rgba(0,0,0,0.5); 
        }
        
        .qubit.broken { 
            border-color: #ff3333; 
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.2), 2px 2px 10px rgba(0,0,0,0.5); 
            animation: shake 1.5s infinite; 
            background: rgba(15, 2, 2, 0.85);
        }
        .qubit.broken::after { content: 'ERR'; color: #ff3333; font-weight: bold; font-size: 12px; }

        .qubit-symbol {
            position: absolute;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; 
        }

        @keyframes pulseBorder {
            0% { border-color: rgba(0, 242, 255, 0.3); }
            100% { border-color: rgba(0, 242, 255, 0.8); }
        }

        @keyframes shake { 
            0% { transform: translate(1px, 1px); } 
            20% { transform: translate(-1px, -1px); } 
            40% { transform: translate(1px, 1px); } 
            60% { transform: translate(-1px, 1px); } 
            80% { transform: translate(1px, -1px); } 
            100% { transform: translate(1px, 1px); } 
        }

        #os-lockdown {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(0, 5, 10, 0.95); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        #os-lockdown.hidden { opacity: 0; pointer-events: none; }
        .captcha-box {
            border: 1px solid var(--neon); background: #020508; padding: 30px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }
        .captcha-box h2 { color: var(--neon); font-family: 'Michroma', sans-serif; font-size: 16px; margin-bottom: 20px; }
        .captcha-box p { color: #aaa; font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-bottom: 20px; line-height: 1.5; }
        #captcha-input {
            background: transparent !important; border: none !important; 
            border-bottom: 2px solid var(--neon) !important; color: var(--neon) !important; 
            font-family: 'JetBrains Mono', monospace !important; font-size: 16px !important; 
            text-align: center !important; outline: none !important; padding: 10px !important; 
            width: 300px !important; margin: 15px auto 0 auto !important; display: block !important;
            text-transform: uppercase !important; letter-spacing: 3px !important; position: static !important;
        }
        @keyframes flow {
            to { stroke-dashoffset: -100; }
        }
    </style>
</head>
<body class="tools-page">

    <div class="chat-system">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="position: fixed; bottom: 25px; right: 25px; z-index: 10000; background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">&gt;_</button>

    <div class="os-header">ОПЕРАЦИОННАЯ СИСТЕМА // СЕКТОР 01</div>
    
    <div class="os-container">
        <svg id="tracesLayer"></svg>
        <div class="qubit-grid" id="qubitGrid"></div>
    </div>

    <div id="os-lockdown">
        <div class="captcha-box">
            <h2>ВЕРИФИКАЦИЯ ЦЕЛОСТНОСТИ</h2>
            <p>ОБНАРУЖЕН ВНЕШНИЙ ЗАПРОС. ДЛЯ ДОСТУПА К ЯДРУ ВВЕДИТЕ ВАШ УНИКАЛЬНЫЙ ИДЕНТИФИКАТОР.</p>
            <p>ПОЛУЧИТЕ ЕГО В КОНСОЛИ КОМАНДОЙ <span class="cmd-text">self --id</span></p>
            <input type="text" id="captcha-input" autocomplete="off" spellcheck="false" placeholder="0x...">
        </div>
    </div>

    <script src="js/loader.js"></script>
    <script src="js/os.js"></script>
</body>
</html>
