<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИГНАЛ-9 // ОПЕРАЦИОННАЯ СИСТЕМА</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        :root { 
            --warn: #ffaa00; 
            --ok: #00ff44; 
            --err: #ff3333; 
        }
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
            background-image: radial-gradient(circle at center, #03101a 0%, #010306 100%);
        }

        .os-header { 
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px; 
            color: var(--neon); text-transform: uppercase; opacity: 0.6; 
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        .terminal-wrapper {
            position: relative; width: 600px; height: 500px;
            background: #000; border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0,0,0,1);
            border-radius: 4px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden; z-index: 10;
            margin-top: 50px;
        }

        .terminal-wrapper::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .corner { 
            position: absolute; width: 25px; height: 25px; border: 2px solid #00f2ff;
            z-index: 20; pointer-events: none; opacity: 1; filter: drop-shadow(0 0 5px #00f2ff);
        }
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .main-layout {
            display: flex; gap: 25px; align-items: center; justify-content: center;
            width: 100%; height: 100%; padding: 20px; box-sizing: border-box; z-index: 5;
        }

        .grid-wrapper { width: 320px; height: 380px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .qubit-grid { display: grid; grid-template-columns: repeat(5, 55px); grid-template-rows: repeat(5, 55px); gap: 12px; }

        .qubit { width: 100%; height: 100%; background: #050505; border: 1px solid rgba(0, 242, 255, 0.3); position: relative; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .qubit::before { content: ''; position: absolute; inset: 6px; border: 1px solid #00f2ff; opacity: 0.8; transition: 0.3s; }
        .qubit::after { content: ''; position: absolute; inset: 16px; background: #00f2ff; box-shadow: 0 0 12px #00f2ff; transition: 0.3s; }
        .qubit.active::after { animation: softPulse 1.5s infinite alternate ease-in-out; animation-delay: var(--delay, 0s); }

        .qubit.broken { border-color: rgba(255, 51, 51, 0.3); }
        .qubit.broken::before { border-color: #ff3333; opacity: 1; }
        .qubit.broken::after { content: ''; background: #ff3333; box-shadow: 0 0 15px #ff3333; animation: blink 1.5s infinite; }

        @keyframes softPulse { 0% { opacity: 0.6; box-shadow: 0 0 8px #00f2ff; } 100% { opacity: 1; box-shadow: 0 0 15px #00f2ff; } }
        @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 15px #ff3333; } 50% { opacity: 0.7; box-shadow: 0 0 5px #ff3333; } }

        .monitor-panel { width: 200px; height: 380px; display: flex; flex-direction: column; gap: 15px; }
        .sys-stats { display: flex; flex-direction: column; gap: 12px; }
        .stat-row { display: flex; flex-direction: column; gap: 4px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; }
        .stat-label span:last-child { color: var(--neon); font-weight: bold; }
        
        .progress-bar { width: 100%; height: 6px; background: rgba(0, 242, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.2); }
        .progress-fill { height: 100%; background: #00f2ff; box-shadow: 0 0 10px #00f2ff; width: 0%; transition: width 0.5s ease-out; }
        .progress-fill.warn { background: #ffaa00 !important; box-shadow: 0 0 10px #ffaa00 !important; }
        .progress-fill.err { background: #ff3333 !important; box-shadow: 0 0 10px #ff3333 !important; }

        .log-box { 
            flex-grow: 1; background: rgba(0, 10, 15, 0.8); border: 1px solid rgba(0, 242, 255, 0.3); 
            padding: 8px; overflow: hidden; display: flex; flex-direction: column; 
            justify-content: flex-end; border-left: 2px solid #00f2ff; 
        }
        
        .log-line { 
            color: #aaa; 
            font-size: 9.5px;         /* Явно задаем размер шрифта */
            line-height: 1.4;        /* Явно задаем высоту строки */
            margin-bottom: 2px;      /* Отступ между строками */
            flex-shrink: 0;          /* ЗАПРЕЩАЕМ СЖАТИЕ СТРОК */
            animation: fadeIn 0.2s ease-out; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            font-family: 'JetBrains Mono', monospace;
        }
        .log-line.ok { color: var(--ok); }
        .log-line.err { color: var(--err); }
    </style>
</head>
<body class="tools-page">

    <div class="chat-system">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="os-header">ОПЕРАЦИОННАЯ СИСТЕМА // СЕКТОР 01</div>
    
    <div class="terminal-wrapper" style="display: none;">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Оверлей удален, остался только рабочий стол -->
        <div class="main-layout" id="os-desktop" style="display: none;">
            <div class="grid-wrapper">
                <div class="qubit-grid" id="qubitGrid"></div>
            </div>

            <div class="monitor-panel">
                <div class="sys-stats">
                    <div class="stat-row">
                        <div class="stat-label"><span>ЗАГРУЗКА CPU</span><span id="valCpu">0%</span></div>
                        <div class="progress-bar"><div class="progress-fill" id="barCpu"></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-label"><span>ОПЕРАТИВНАЯ ПАМЯТЬ</span><span id="valRam">0%</span></div>
                        <div class="progress-bar"><div class="progress-fill" id="barRam"></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-label"><span>ХРАНИЛИЩЕ</span><span id="valDisk">0%</span></div>
                        <div class="progress-bar"><div class="progress-fill" id="barDisk"></div></div>
                    </div>
                </div>

                <div class="log-box" id="logBox">
                    <div class="log-line ok">> SYS_MONITOR: ACTIVE</div>
                </div>
            </div>
        </div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="position: fixed; bottom: 25px; right: 25px; z-index: 100000; background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">&gt;_</button>

    <script src="js/loader.js"></script>
    <script src="js/os.js"></script>
</body>
</html>
