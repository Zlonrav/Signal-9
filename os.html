<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="js/auth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИГНАЛ-9 // ОПЕРАЦИОННАЯ СИСТЕМА</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        :root { 
            --warn: #ffaa00; 
            --ok: #00ff44; 
            --err: #ff3333; 
            --ent: #a200ff;
            --locked: #555555;
            --neon: #00f2ff;
        }
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
            background-image: radial-gradient(circle at center, #03101a 0%, #010306 100%);
            font-family: 'JetBrains Mono', monospace; color: #fff;
        }

        .terminal-wrapper {
            position: relative; width: 600px; height: 500px;
            display: flex; align-items: center; justify-content: center; 
            z-index: 10; margin-top: 30px;
            overflow: visible;
        }

        .terminal-wrapper::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* --- ЩИТ БЛОКИРОВКИ --- */
        #os-shield-overlay {
            position: absolute; inset: 0; display: none; 
            align-items: center; justify-content: center;
            z-index: 50; background: transparent; cursor: default;
        }
        .shield-container { cursor: pointer; width: 320px; height: 320px; }
        .shield-base {
            position: relative; width: 100%; height: 100%;
            border-radius: 50%; border: 1px solid rgba(255, 51, 51, 0.4);
            box-shadow: 0 0 40px rgba(255, 51, 51, 0.2), inset 0 0 30px rgba(255, 51, 51, 0.15);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out; transform: translateZ(0); 
        }
        .shield-container:hover .shield-base { transform: translateZ(0) scale(1.05); opacity: 0.9; }
        .grid-bg {
            position: absolute; inset: -50%;
            background-image: linear-gradient(rgba(255, 51, 51, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 51, 51, 0.2) 1px, transparent 1px);
            background-size: 30px 30px; transform: perspective(300px) rotateX(45deg) rotateZ(45deg);
            animation: grid-move 5s linear infinite; z-index: 1;
        }
        .rotator { position: absolute; width: 280px; height: 280px; z-index: 3; animation: spin 10s linear infinite; }
        .bracket { position: absolute; width: 100%; height: 100%; border: 2px solid var(--err); border-radius: 50%; clip-path: polygon(0 0, 14% 0, 14% 100%, 0 100%); filter: drop-shadow(0 0 8px var(--err)); box-shadow: inset 0 0 10px rgba(255, 51, 51, 0.5); }
        .b1 { transform: rotate(0deg); } .b2 { transform: rotate(90deg); } .b3 { transform: rotate(180deg); } .b4 { transform: rotate(270deg); }
        .shield-text { position: absolute; z-index: 30; text-align: center; pointer-events: none; background: rgba(20, 0, 0, 0.85); padding: 15px 30px; border-radius: 4px; border: 1px solid rgba(255, 51, 51, 0.4); box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); backdrop-filter: blur(2px); }
        .shield-text h2 { margin: 0; font-family: 'Michroma', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--err); text-shadow: 0 0 15px var(--err); }
        .shield-text p { margin: 8px 0 0 0; font-size: 11px; color: #ff8888; letter-spacing: 2px; }
        
        /* --- РАБОЧИЙ СТОЛ --- */
        .main-layout {
            display: flex; gap: 25px; align-items: center; justify-content: center;
            width: 100%; height: 100%; z-index: 5;
        }

        .left-panel { 
            width: 380px; height: 380px; 
            display: flex; flex-direction: column; gap: 10px; 
            overflow: hidden; 
        }

        .tabs-container { display: flex; justify-content: space-between; gap: 5px; flex-shrink: 0; }
        .layer-tab {
            flex: 1; padding: 6px 0; text-align: center; background: rgba(0, 20, 30, 0.8);
            border: 1px solid rgba(0, 242, 255, 0.2); color: rgba(0, 242, 255, 0.6);
            cursor: pointer; font-size: 10px; text-transform: uppercase; transition: 0.3s;
            position: relative; user-select: none;
        }
        .layer-tab:hover { background: rgba(0, 242, 255, 0.1); color: var(--neon); }
        .layer-tab.active { background: rgba(0, 242, 255, 0.2); border-color: var(--neon); color: var(--neon); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
        
        .status-dot { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; }
        .dot-clean { background: rgba(255, 255, 255, 0.1); box-shadow: none; }
        .dot-err { background: var(--err); box-shadow: 0 0 5px var(--err); }
        .dot-warn { background: var(--warn); box-shadow: 0 0 5px var(--warn); }
        .dot-ent { background: var(--ent); box-shadow: 0 0 5px var(--ent); }

        .grid-container { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border-radius: 4px; }
        .grid-wrapper { height: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }

        /* --- АНИМАЦИИ СЛОЕВ --- */
        @keyframes flyOutToPast { 0% { transform: scale(1); opacity: 1; filter: blur(0); } 100% { transform: scale(1.6); opacity: 0; filter: blur(10px); } }
        @keyframes flyInFromFuture { 0% { transform: scale(0.2); opacity: 0; filter: blur(10px); } 100% { transform: scale(1); opacity: 1; filter: blur(0); } }
        @keyframes flyOutToFuture { 0% { transform: scale(1); opacity: 1; filter: blur(0); } 100% { transform: scale(0.2); opacity: 0; filter: blur(10px); } }
        @keyframes flyInFromPast { 0% { transform: scale(1.6); opacity: 0; filter: blur(10px); } 100% { transform: scale(1); opacity: 1; filter: blur(0); } }

        .anim-out-past { animation: flyOutToPast 0.6s ease-in forwards; }
        .anim-in-future { animation: flyInFromFuture 0.6s ease-out forwards; }
        .anim-out-future { animation: flyOutToFuture 0.6s ease-in forwards; }
        .anim-in-past { animation: flyInFromPast 0.6s ease-out forwards; }

        .qubit-grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 8px; transform: rotateX(5deg); }

        /* --- КУБИТЫ --- */
        .qubit {
            background: #050505; border: 1px solid rgba(0, 242, 255, 0.3);
            position: relative; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            aspect-ratio: 1; transition: 0.3s;
        }
        .qubit::before { content: ''; position: absolute; inset: 4px; border: 1px solid var(--neon); opacity: 0.7; transition: 0.3s; }
        .qubit::after { content: ''; position: absolute; inset: 12px; background: var(--neon); opacity: 0.6; box-shadow: 0 0 8px var(--neon); transition: 0.3s; }

        .q-broken { border-color: var(--err); }
        .q-broken::before { border-color: var(--err); opacity: 1; }
        .q-broken::after { background: var(--err); opacity: 1; box-shadow: 0 0 15px var(--err); animation: blink 1.2s infinite; }

        .q-warn { border-color: var(--warn); }
        .q-warn::before { border-color: var(--warn); opacity: 1; }
        .q-warn::after { background: var(--warn); opacity: 1; box-shadow: 0 0 15px var(--warn); animation: blink 1s infinite alternate; }

        .q-ent { border-color: var(--ent); }
        .q-ent::before { border-color: var(--ent); opacity: 1; }
        .q-ent::after { background: var(--ent); opacity: 1; box-shadow: 0 0 15px var(--ent); animation: softPulse 1.5s infinite alternate; }

        .pair-dot { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; z-index: 5; }
        .pair-A { background: #ffaa00; box-shadow: 0 0 5px #ffaa00; }
        .pair-B { background: #00ff44; box-shadow: 0 0 5px #00ff44; }

        /* Правая панель (мониторинг) */
        .monitor-panel { 
            width: 195px; height: 380px; 
            display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; z-index: 10; 
        }
        .sys-stats { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .stat-row { display: flex; flex-direction: column; gap: 4px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; }
        .stat-label span:last-child { color: var(--neon); font-weight: bold; }
        
        .progress-bar { width: 100%; height: 6px; background: rgba(0, 242, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.2); }
        .progress-fill { height: 100%; background: #00f2ff; box-shadow: 0 0 10px #00f2ff; width: 0%; transition: width 0.5s ease-out; }

        /* Журнал */
        .log-box { 
            flex-grow: 1; min-height: 0; /* КРИТИЧНО для flex */
            background: rgba(0, 10, 15, 0.8); border: 1px solid rgba(0, 242, 255, 0.3); 
            padding: 8px; overflow: hidden; display: flex; flex-direction: column; 
            justify-content: flex-end; border-left: 2px solid #00f2ff; 
        }
        .log-line { color: #aaa; font-size: 9.5px; line-height: 1.4; margin-bottom: 2px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-line.ok { color: var(--ok); }
        .log-line.err { color: var(--err); }

        @keyframes grid-move { 0% { transform: perspective(300px) rotateX(45deg) rotateZ(45deg) translateY(0); } 100% { transform: perspective(300px) rotateX(45deg) rotateZ(45deg) translateY(30px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- МОДАЛЬНОЕ ОКНО ИСХОДНОГО КОДА --- */
        #source-modal {
            position: fixed; inset: 0; background: rgba(0, 5, 10, 0.95); backdrop-filter: blur(5px);
            z-index: 9999999; display: none; flex-direction: column;
            opacity: 0; transition: opacity 0.3s ease;
        }
        #source-modal.active { display: flex; opacity: 1; }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            background: #010306;
        }
        .modal-header span {
            font-family: 'Play', 'JetBrains Mono', monospace; letter-spacing: 2px; font-size: 16px;
            color: var(--neon); text-shadow: 0 0 5px var(--neon); font-weight: bold;
        }
        .modal-header .close-btn {
            background: transparent; border: none; color: var(--neon); font-size: 20px;
            cursor: pointer; transition: 0.2s; padding: 0 10px;
        }
        .modal-header .close-btn:hover { color: #ff3333; text-shadow: 0 0 10px #ff3333; }

        .modal-body {
            flex-grow: 1; display: flex; overflow: auto; padding: 20px;
            background: #020508; font-size: 14px; line-height: 1.5; text-align: left;
        }
        .modal-body::-webkit-scrollbar { width: 6px; height: 6px; }
        .modal-body::-webkit-scrollbar-track { background: #000; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--neon); box-shadow: 0 0 10px var(--neon); border-radius: 3px; }

        .line-numbers {
            display: flex; flex-direction: column; align-items: flex-end;
            padding-right: 15px; margin-right: 15px; border-right: 1px solid rgba(0, 242, 255, 0.2);
            color: #555; user-select: none; font-size: 13px; font-family: 'JetBrains Mono', monospace;
        }
        .line-numbers span { height: 21px; }

        .code-content {
            margin: 0; white-space: pre; font-family: 'JetBrains Mono', monospace; color: #ccc;
        }

        .token-tag { color: #00f2ff; }
        .token-attr { color: #ffaa00; }
        .token-string { color: #00ff44; }
        .token-comment { color: #555; font-style: italic; }
        .token-keyword { color: #ff00ff; }
    </style>
</head>
