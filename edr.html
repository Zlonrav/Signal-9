<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИГНАЛ-9 // EDR СЕКТОР</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
            background-image: radial-gradient(circle at center, #03101a 0%, #010306 100%);
        }

        .edr-header { 
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px; 
            color: var(--neon); text-transform: uppercase; opacity: 0.6; 
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        /* --- ЕДИНЫЙ ТЕРМИНАЛ (РАЗМЕР ДО УМЕНЬШЕНИЯ) --- */
        .terminal-wrapper {
            position: relative; width: 1050px; height: 600px;
            background: #000; border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0,0,0,1);
            border-radius: 4px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden; z-index: 10;
        }

        .terminal-wrapper::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .terminal-wrapper::after {
            content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px;
            pointer-events: none;
            background: 
                linear-gradient(to right, var(--neon) 15px, transparent 15px) 0 0,
                linear-gradient(to bottom, var(--neon) 15px, transparent 15px) 0 0,
                linear-gradient(to left, var(--neon) 15px, transparent 15px) 100% 0,
                linear-gradient(to bottom, var(--neon) 15px, transparent 15px) 100% 0,
                linear-gradient(to right, var(--neon) 15px, transparent 15px) 0 100%,
                linear-gradient(to top, var(--neon) 15px, transparent 15px) 0 100%,
                linear-gradient(to left, var(--neon) 15px, transparent 15px) 100% 100%,
                linear-gradient(to top, var(--neon) 15px, transparent 15px) 100% 100%;
            background-repeat: no-repeat; background-size: 2px 15px, 15px 2px; opacity: 0.8;
        }

        .terminal-hint {
            position: absolute; bottom: 15px; right: 20px;
            color: #555; font-size: 10px; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace;
            z-index: 100;
        }

        /* --- СТИЛИ ДЛЯ СОДЕРЖИМОГО --- */
        #edrContent { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; position: relative; z-index: 5;}

        .code-line { margin-bottom: 5px; color: #ccc; font-size: 15px; text-align: left; width: 100%;}
        .indent { padding-left: 25px; }
        .kw { color: #ffaa00; font-weight: bold; }
        .num { color: #00ff44; }
        .var { color: #00f2ff; }
        .op { color: #fff; }

        .terminal-input {
            background: transparent !important; border: none !important; border-bottom: 2px solid var(--neon) !important;
            color: var(--neon) !important; font-family: 'JetBrains Mono', monospace !important; font-size: 24px !important;
            text-align: center !important; outline: none !important; padding: 10px !important; width: 300px !important;
            letter-spacing: 4px !important; transition: border-color 0.2s, box-shadow 0.2s !important;
            margin: 15px auto 0 !important; display: block !important;
            position: static !important;
        }
        
        .terminal-input:focus { 
            border-bottom-color: var(--neon) !important; 
            box-shadow: 0 5px 10px -5px var(--neon) !important; 
        }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
        .shake { animation: shake 0.4s; border-bottom-color: #ff3333 !important; color: #ff3333 !important; }

        .mobile-btn { display: none; background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px 30px; font-family: 'JetBrains Mono', monospace; font-size: 14px; margin-top: 15px; cursor: pointer; }
        @media (max-width: 768px) { .mobile-btn { display: block; } }
        .status-msg { margin-top: 15px; font-size: 14px; height: 20px; font-weight: bold; }

        /* Мастермайнд */
        .mm-logs { width: 350px; height: 200px; overflow-y: auto; border: 1px solid rgba(0,242,255,0.2); padding: 10px; font-size: 12px; margin-bottom: 20px; text-align: left; font-family: monospace; background: rgba(0,0,0,0.5);}
        .mm-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .mm-inputs input { width: 40px; height: 50px; background: transparent; border: 1px solid var(--neon); color: var(--neon); font-size: 24px; text-align: center; font-family: monospace; outline: none; }
        .mm-inputs input:focus { box-shadow: 0 0 10px var(--neon); }

        /* --- РАБОЧИЙ РЕЖИМ (ЩИТ) - РАЗМЕРЫ ДО УМЕНЬШЕНИЯ --- */
        .main-layout { display: flex; gap: 40px; align-items: stretch; justify-content: center; width: 100%; height: 100%; }
        
        .shield-wrapper { 
            position: relative; 
            width: 450px; 
            height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            animation: shieldPulse 3s infinite alternate; flex-shrink: 0;
        }
        @keyframes shieldPulse { 0% { filter: drop-shadow(0 0 1px var(--neon)) drop-shadow(0 0 10px rgba(0, 242, 255, 0.2)); } 100% { filter: drop-shadow(0 0 1px var(--neon)) drop-shadow(0 0 30px rgba(0, 242, 255, 0.6)); } }
        .shield-shape { width: 100%; height: 100%; background: rgba(0, 20, 30, 0.8); clip-path: polygon(50% 0%, 100% 10%, 100% 75%, 50% 100%, 0% 75%, 0% 10%); display: grid; grid-template-columns: repeat(14, 1fr); grid-template-rows: repeat(16, 1fr); gap: 2px; }
        .shield-cell { background: rgba(0, 242, 255, 0.03); border: 1px solid rgba(0, 242, 255, 0.05); transition: background 1.5s ease-out, box-shadow 1.5s ease-out, border-color 0.2s; }
        .shield-cell.scanning { background: rgba(0, 242, 255, 0.8) !important; box-shadow: 0 0 15px #00f2ff !important; border-color: #00f2ff !important; transition: none !important; }
        .shield-cell.threat { background: #ff3333 !important; box-shadow: 0 0 20px #ff3333 !important; border-color: #ff3333 !important; transition: none !important; animation: threatBlink 1s infinite; }
        .shield-cell.cleared { background: #00ff44 !important; box-shadow: 0 0 20px #00ff44 !important; border-color: #00ff44 !important; transition: all 0.5s ease-in !important; }
        @keyframes threatBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .side-panel { width: 380px; height: 100%; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        .counters { display: flex; justify-content: space-between; background: rgba(0, 20, 30, 0.6); border: 1px solid rgba(0, 242, 255, 0.2); padding: 10px; border-radius: 4px; flex-shrink: 0; }
        .counter-box { text-align: center; flex: 1; }
        .counter-label { font-size: 10px; color: #888; letter-spacing: 1px; margin-bottom: 5px; }
        .counter-value { font-size: 18px; font-weight: bold; font-family: 'Michroma', sans-serif; }
        #cnt-scanned { color: #00f2ff; text-shadow: 0 0 10px #00f2ff; }
        #cnt-threats { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
        #cnt-cleared { color: #00ff44; text-shadow: 0 0 10px #00ff44; }
        
        .log-container { flex-grow: 1; background: rgba(0, 10, 15, 0.9); border: 1px solid rgba(0, 242, 255, 0.3); padding: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; border-left: 3px solid #00f2ff; }
        .log-box { display: flex; flex-direction: column; gap: 3px; font-size: 11px; line-height: 1.3; text-align: left;}
        .log-line { color: #aaa; animation: fadeIn 0.2s ease-out; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-line.warn { color: #ff3333 !important; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        .log-line.ok { color: #00ff44 !important; text-shadow: 0 0 5px rgba(0, 255, 68, 0.5); }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="tools-page">

    <div class="chat-system" style="display: none;">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="edr-header">СИСТЕМА EDR // СЕКТОР 10</div>
    
    <div class="terminal-wrapper">
        <div id="edrContent"></div>
        <div class="terminal-hint" id="edr-hint" style="display: none;">[ENTER] - ВЫПОЛНИТЬ</div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="position: fixed; bottom: 25px; right: 25px; z-index: 100000; background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">&gt;_</button>

    <script src="js/loader.js"></script>
    <script src="js/edr.js"></script>
</body>
</html>
