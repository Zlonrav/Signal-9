<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<script src="js/auth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИГНАЛ-9 // EDR СЕКТОР</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
	    :root { 
            --warn: #ffaa00; 
            --ok: #00ff44; 
            --err: #ff3333; 
        }
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
            background-image: radial-gradient(circle at center, #03101a 0%, #010306 100%);
        }

        .edr-header { 
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px; 
            color: var(--neon); text-transform: uppercase; opacity: 0.6; 
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        .terminal-wrapper {
            position: relative; width: 600px; height: 500px;
            background: #000; border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0,0,0,1);
            border-radius: 4px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden; z-index: 10;
            margin-top: 50px;
        }

        .terminal-wrapper::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .corner { 
            position: absolute; width: 25px; height: 25px; border: 2px solid #00f2ff;
            z-index: 20; pointer-events: none; opacity: 1; filter: drop-shadow(0 0 5px #00f2ff);
        }
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        #edrContent { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; position: relative; z-index: 5; }
        
        /* Заглушка для визуала */
        .sandbox-visual { font-family: 'Michroma'; font-size: 18px; color: var(--neon); text-shadow: 0 0 10px var(--neon); opacity: 0.3; letter-spacing: 4px; }

        /* Рабочий режим (Щит) */
        .main-layout { display: flex; gap: 5%; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .shield-wrapper { position: relative; height: 90%; aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; animation: shieldPulse 3s infinite alternate; flex-shrink: 0; }
        @keyframes shieldPulse { 0% { filter: drop-shadow(0 0 1px var(--neon)) drop-shadow(0 0 10px rgba(0, 242, 255, 0.2)); } 100% { filter: drop-shadow(0 0 1px var(--neon)) drop-shadow(0 0 30px rgba(0, 242, 255, 0.6)); } }
        .shield-shape { width: 100%; height: 100%; background: rgba(0, 20, 30, 0.8); clip-path: polygon(50% 0%, 100% 10%, 100% 75%, 50% 100%, 0% 75%, 0% 10%); display: grid; grid-template-columns: repeat(14, 1fr); grid-template-rows: repeat(16, 1fr); gap: 1px; }
        .shield-cell { background: rgba(0, 242, 255, 0.03); border: 1px solid rgba(0, 242, 255, 0.05); transition: background 1.5s ease-out, box-shadow 1.5s ease-out, border-color 0.2s; }
        .shield-cell.scanning { background: rgba(0, 242, 255, 0.8) !important; box-shadow: 0 0 10px #00f2ff !important; border-color: #00f2ff !important; transition: none !important; }
        .shield-cell.threat { background: #ff3333 !important; box-shadow: 0 0 15px #ff3333 !important; border-color: #ff3333 !important; transition: none !important; animation: threatBlink 1s infinite; }
        .shield-cell.cleared { background: #00ff44 !important; box-shadow: 0 0 15px #00ff44 !important; border-color: #00ff44 !important; transition: all 0.5s ease-in !important; }
        @keyframes threatBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .side-panel { width: 39%; height: 90%; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .counters { display: flex; justify-content: space-between; background: rgba(0, 20, 30, 0.6); border: 1px solid rgba(0, 242, 255, 0.2); padding: 8px; border-radius: 4px; flex-shrink: 0; }
        .counter-box { text-align: center; flex: 1; }
        .counter-label { font-size: 9px; color: #888; letter-spacing: 1px; margin-bottom: 3px; }
        .counter-value { font-size: 15px; font-weight: bold; font-family: 'Michroma', sans-serif; }
        #cnt-scanned { color: #00f2ff; text-shadow: 0 0 10px #00f2ff; }
        #cnt-threats { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
        #cnt-cleared { color: #00ff44; text-shadow: 0 0 10px #00ff44; }
        
        .log-container { flex-grow: 1; background: rgba(0, 10, 15, 0.9); border: 1px solid rgba(0, 242, 255, 0.3); padding: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; border-left: 2px solid #00f2ff; }
                .log-box { display: flex; flex-direction: column; gap: 2px; font-size: 9.5px; line-height: 1.3; text-align: left;}
        .log-line { color: #aaa; animation: fadeIn 0.2s ease-out; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-line.warn { color: #ff3333 !important; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        .log-line.ok { color: #00ff44 !important; text-shadow: 0 0 5px rgba(0, 255, 68, 0.5); }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="tools-page">

    <div class="chat-system">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="edr-header">СИСТЕМА EDR // СЕКТОР 10</div>
    
    <div class="terminal-wrapper" style="display: none;">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

		<div id="edrContent"></div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="position: fixed; bottom: 25px; right: 25px; z-index: 100000; background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">&gt;_</button>

    <script src="js/loader.js"></script>
    <script src="js/edr.js"></script>
</body>
</html>
