<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИГНАЛ-9 // EDR СЕКТОР</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
        }

        .edr-header { 
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px; 
            color: var(--neon); text-transform: uppercase; opacity: 0.6; 
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        /* Сдвигаем контейнер вниз, чтобы не наезжать на чат */
        .edr-container {
            position: relative; width: 1050px; height: 600px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            background: rgba(2, 10, 15, 0.9);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1), inset 0 0 30px rgba(0, 242, 255, 0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box; border-radius: 4px; z-index: 10;
            margin-top: 60px; /* Отступ сверху для журнала */
        }

        /* --- СТИЛИ ДЛЯ ПЕСОЧНИЦЫ (АЛГОРИТМЫ) --- */
        .code-box {
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 20px; font-size: 14px; line-height: 1.8;
            margin-bottom: 20px; text-align: left; width: 450px;
            background: #000; box-shadow: inset 0 0 20px rgba(0,0,0,1);
            font-family: 'JetBrains Mono', monospace;
        }
        .code-input {
            background: transparent; border: none; border-bottom: 2px solid var(--neon);
            color: var(--neon); font-family: inherit; font-size: 20px;
            text-align: center; outline: none; padding: 10px; width: 200px;
            margin-top: 10px; letter-spacing: 2px;
            position: static !important;
        }

        /* --- СТИЛИ ДЛЯ МАСТЕРМАЙНДА (ВЗЛОМ ШИФРА) --- */
        .mm-logs { width: 350px; height: 200px; overflow-y: auto; border: 1px solid rgba(0,242,255,0.2); padding: 10px; font-size: 12px; margin-bottom: 20px; text-align: left; font-family: monospace;}
        .mm-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .mm-inputs input {
            width: 40px; height: 50px; background: transparent; border: 1px solid var(--neon);
            color: var(--neon); font-size: 24px; text-align: center; font-family: monospace;
            outline: none; text-transform: uppercase;
        }

        /* --- СТИЛИ ДЛЯ РАБОЧЕГО РЕЖИМА (ЩИТ) --- */
        .main-layout {
            display: flex;
            gap: 40px;
            align-items: stretch;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            height: 100%;
        }

        .shield-wrapper {
            position: relative;
            width: 450px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: shieldPulse 3s infinite alternate;
        }

        @keyframes shieldPulse {
            0% { filter: drop-shadow(0 0 1px var(--neon)) drop-shadow(0 0 10px rgba(0, 242, 255, 0.2)); }
            100% { filter: drop-shadow(0 0 1px var(--neon)) drop-shadow(0 0 30px rgba(0, 242, 255, 0.6)); }
        }

        .shield-shape {
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 30, 0.8);
            clip-path: polygon(50% 0%, 100% 10%, 100% 75%, 50% 100%, 0% 75%, 0% 10%);
            position: relative;
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            grid-template-rows: repeat(16, 1fr);
            gap: 2px;
        }

        /* --- БАЗОВЫЙ ЦВЕТ ЯЧЕЙКИ --- */
        .shield-cell {
            background: rgba(0, 242, 255, 0.03);
            border: 1px solid rgba(0, 242, 255, 0.05);
            transition: background 1.5s ease-out, box-shadow 1.5s ease-out, border-color 0.2s;
        }

        /* --- ПОДСВЕТКА СКАНИРОВАНИЯ (СИНИЙ) --- */
        .shield-cell.scanning {
            background: rgba(0, 242, 255, 0.6) !important;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.6) !important;
            border-color: var(--neon) !important;
            transition: none !important;
        }

        /* --- ПОДСВЕТКА УГРОЗЫ (КРАСНЫЙ) --- */
        .shield-cell.threat {
            background: var(--err) !important;
            box-shadow: 0 0 15px var(--err) !important;
            border-color: var(--err) !important;
            transition: none !important;
            animation: threatBlink 1s infinite;
        }

        /* --- ПОДСВЕТКА УСТРАНЕНИЯ (ЗЕЛЕНЫЙ) --- */
        .shield-cell.cleared {
            background: var(--ok) !important;
            box-shadow: 0 0 15px var(--ok) !important;
            border-color: var(--ok) !important;
            transition: all 0.5s ease-in !important;
        }

        @keyframes threatBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* --- ПРАВАЯ ПАНЕЛЬ --- */
        .side-panel {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        .counters {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 20, 30, 0.6);
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 10px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .counter-box {
            text-align: center;
            flex: 1;
        }

        .counter-label {
            font-size: 10px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .counter-value {
            font-size: 18px;
            font-weight: bold;
            font-family: 'Michroma', sans-serif;
        }

        #cnt-scanned { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        #cnt-threats { color: var(--err); text-shadow: 0 0 10px var(--err); }
        #cnt-cleared { color: var(--ok); text-shadow: 0 0 10px var(--ok); }

        .log-container {
            flex-grow: 1;
            background: rgba(0, 10, 15, 0.9);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-left: 3px solid var(--neon);
        }

        .log-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
            line-height: 1.3;
        }

        .log-line {
            color: #aaa;
            animation: fadeIn 0.2s ease-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* --- ПОДСВЕТКА ЛОГОВ --- */
        .log-line.warn { color: var(--err) !important; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        .log-line.ok { color: var(--ok) !important; text-shadow: 0 0 5px rgba(0, 255, 68, 0.5); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="tools-page">

    <!-- ВОЗВРАЩАЕМ ЖУРНАЛ КАК ЕСТЬ -->
    <div class="chat-system">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="edr-header">СИСТЕМА EDR // СЕКТОР 10</div>
    
    <div class="edr-container" id="edrContent">
        <!-- Содержимое будет меняться через JS -->
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="position: fixed; bottom: 25px; right: 25px; z-index: 100000; background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">&gt;_</button>

    <script src="js/loader.js"></script>
    <script src="js/edr.js"></script>
</body>
</html>
