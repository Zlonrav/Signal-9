<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СИГНАЛ-9 // ТОПОЛОГИЯ СТАНЦИИ</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        /* --- БАЗА --- */
        body.tools-page {
            overflow: hidden; 
            height: 100vh;
            background-color: #010306;
        }

        #display {
            display: flex !important;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .map-header {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Michroma', sans-serif;
            font-size: 14px;
            letter-spacing: 8px;
            color: var(--neon);
            text-transform: uppercase;
            opacity: 0.6;
            text-shadow: 0 0 20px var(--neon);
            z-index: 100;
            pointer-events: none;
        }

        /* --- КАРТА --- */
        .map-container {
            position: relative;
            width: 1200px; 
            height: 800px;
        }

        /* Сетка на фоне */
        .map-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            mask-image: radial-gradient(circle at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 70%);
            pointer-events: none;
        }

        /* --- СЛОЙ СВЯЗЕЙ --- */
        .connections-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        
        .link-bg { stroke: rgba(0, 242, 255, 0.05); stroke-width: 2px; transition: 0.3s; }
        .link-flow { stroke: var(--neon); stroke-width: 2px; stroke-dasharray: 8 16; filter: drop-shadow(0 0 5px var(--neon)); animation: flow 20s linear infinite; transition: 0.3s;}
        
        /* Линии к OFFLINE узлам - тусклые */
        .link-locked .link-bg { stroke: rgba(255, 255, 255, 0.05); stroke-dasharray: 4 4; }
        .link-locked .link-flow { stroke: none; }

        @keyframes flow { to { stroke-dashoffset: -1000; } }

        /* --- УЗЛЫ --- */
        .map-node {
            position: absolute;
            width: 130px;
            height: 130px;
            background: rgba(2, 10, 15, 0.85);
            border: 1px solid rgba(0, 242, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            backdrop-filter: blur(8px);
        }

        /* Уголки */
        .map-node::before, .map-node::after {
            content: ''; position: absolute; width: 10px; height: 10px; pointer-events: none; transition: 0.3s;
        }
        .map-node.unlocked::before { top: -1px; left: -1px; border-top: 2px solid var(--neon); border-left: 2px solid var(--neon); }
        .map-node.unlocked::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--neon); border-right: 2px solid var(--neon); }

        /* Наведение на ONLINE узел */
        .map-node.unlocked:hover {
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2), inset 0 0 20px rgba(0, 242, 255, 0.1);
            transform: translate(-50%, -50%) scale(1.05);
        }
        .map-node.unlocked:hover::before, .map-node.unlocked:hover::after { width: 100%; height: 100%; opacity: 0.3; }

        /* =========================================
           СТИЛИ ДЛЯ OFFLINE УЗЛОВ (СЕРЫЕ, ЗАТУШЕННЫЕ)
           ========================================= */
        .map-node.locked {
            border-color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            background: rgba(10, 10, 10, 0.8);
        }
        
        .map-node.locked .node-icon { 
            color: #555; 
            filter: none;
            opacity: 0.5;
        }
        
        .map-node.locked .node-title {
            color: #666;
            text-shadow: none;
        }

        .map-node.locked .node-status {
            color: #ff3333; /* Красный OFFLINE */
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        /* Общие стили для иконок и текста */
        .node-icon {
            width: 45px;
            height: 45px;
            margin-bottom: 15px;
            color: var(--neon);
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.6));
            transition: 0.3s;
        }
        .map-node.unlocked:hover .node-icon { transform: scale(1.1); }
        
        .node-title {
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--neon);
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            font-weight: bold;
            line-height: 1.4;
            pointer-events: none;
            transition: 0.3s;
        }

        .node-status {
            position: absolute;
            bottom: 8px;
            font-size: 8px;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .map-node.unlocked .node-status { color: #00ff44; } /* Зеленый ONLINE */

        /* Центральный хаб */
        .map-node[data-id="hub"] {
            width: 150px; height: 150px;
            border-color: rgba(0, 242, 255, 0.4);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
        }

        /* --- КОНСОЛЬ (ТИЛЬДА) --- */
        #tilde-console {
            display: none; /* Скрыто по умолчанию */
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            background: rgba(2, 5, 8, 0.95);
            border: 1px solid var(--neon);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            z-index: 99999;
            font-family: 'JetBrains Mono', monospace;
            backdrop-filter: blur(10px);
            flex-direction: column;
            padding: 20px;
        }

        #tilde-console.active { display: flex; }

        .console-header {
            color: var(--neon);
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .console-output {
            color: #aaa;
            font-size: 11px;
            margin-bottom: 15px;
            line-height: 1.5;
            height: 100px;
            overflow-y: auto;
        }
        .console-output .sys { color: var(--neon); }
        .console-output .err { color: #ff3333; }
        .console-output .ok { color: #00ff44; }

        .console-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .console-input-wrapper span { color: var(--neon); font-size: 14px; font-weight: bold; }
        
        #console-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0, 242, 255, 0.5);
            color: var(--neon);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            padding: 5px 0;
            text-transform: uppercase;
        }
        #console-input:focus { border-bottom-color: var(--neon); box-shadow: 0 5px 10px -5px var(--neon); }

        .console-hint {
            margin-top: 15px;
            font-size: 9px;
            color: #555;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body class="tools-page">
    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="map-header">СИСТЕМА ТОПОЛОГИИ // СЕКТОР 07</div>

    <div id="display">
        <div class="map-container" id="mapContainer">
            <svg class="connections-layer" id="mapLines"></svg>
            <div id="mapNodes"></div>
        </div>
    </div>

    <!-- СКРЫТАЯ КОНСОЛЬ ПО ТИЛЬДЕ -->
    <div id="tilde-console">
        <div class="console-header">Терминал быстрого доступа // Введите ID отсека</div>
        <div class="console-output" id="console-output">
            <div>Инициализация протокола ручного перемещения...</div>
            <div>Доступные отсеки: <span class="sys">HUB, ARCHIVE, REACTOR, TOOLS, OBSERVATORY, HANGAR, MEDBAY, SECTOR</span></div>
        </div>
        <div class="console-input-wrapper">
            <span>></span>
            <input type="text" id="console-input" autocomplete="off" spellcheck="false" placeholder="Введите ID...">
        </div>
        <div class="console-hint">
            <span>[ESC] - закрыть</span>
            <span>[ENTER] - перейти</span>
        </div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <a href="tools.html" class="terminal-link-fixed">
        <span>□</span> ИНЖЕНЕРНЫЙ ТЕРМИНАЛ
    </a>

<script>
    // --- КОНФИГУРАЦИЯ КАРТЫ ---
    // Располагаем узлы в виде красивой сетки
    const MAP_DATA = {
        nodes: [
            // Центр
            { id: 'hub', title: 'ГЛАВНЫЙ\nХАБ', x: 600, y: 400, url: 'index.html', req: null, 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v6m0 8v6M2 12h6m8 0h6"></path></svg>` },
            
            // Верхний ряд
            { id: 'tools', title: 'ХРАНИЛИЩЕ\n(ТЕРМИНАЛ)', x: 420, y: 200, url: 'tools.html', req: null, 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16M8 6v12M16 6v12"></path></svg>` },
            { id: 'sector', title: 'НЕИЗВЕСТНЫЙ\nСЕКТОР', x: 780, y: 200, url: '#', req: 's9_sector_opened', 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>` },
            { id: 'reserved1', title: 'МОДУЛЬ\n[РЕЗЕРВ]', x: 600, y: 150, url: '#', req: 's9_res1', 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>` },

            // Средний ряд
            { id: 'observatory', title: 'ОБСЕРВАТОРИЯ', x: 180, y: 400, url: 'observatory.html', req: 's9_observatory', 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="12" x2="16" y2="16"></line></svg>` },
            { id: 'map', title: 'КАРТА', x: 420, y: 400, url: 'map.html', req: null, 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon></svg>` },
            { id: 'reactor', title: 'РЕАКТОР', x: 780, y: 400, url: 'reactor.html', req: 's9_emergency_reactor', 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>` },
            { id: 'hangar', title: 'АНГАР', x: 1020, y: 400, url: 'hangar.html', req: 's9_hangar_open', 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>` },

            // Нижний ряд
            { id: 'archive', title: 'АРХИВ', x: 420, y: 600, url: 'archive.html', req: 's9_access_granted', 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>` },
            { id: 'medbay', title: 'МЕДОТСЕК', x: 780, y: 600, url: 'medbay.html', req: 's9_medbay_open', 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M2 12h20"></path></svg>` },
            { id: 'reserved2', title: 'МОДУЛЬ\n[РЕЗЕРВ]', x: 600, y: 650, url: '#', req: 's9_res2', 
              icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>` },
        ],
        links: [
            // Соединяем всё с центром
            { s: 'hub', t: 'tools' }, { s: 'hub', t: 'sector' }, { s: 'hub', t: 'observatory' }, 
            { s: 'hub', t: 'map' }, { s: 'hub', t: 'reactor' }, { s: 'hub', t: 'hangar' },
            { s: 'hub', t: 'archive' }, { s: 'hub', t: 'medbay' },
            // Резервные
            { s: 'hub', t: 'reserved1' }, { s: 'hub', t: 'reserved2' },
            // Горизонтальные связи
            { s: 'tools', t: 'map' }, { s: 'map', t: 'archive' }, { s: 'map', t: 'reactor' },
            { s: 'observatory', t: 'map' }, { s: 'reactor', t: 'hangar' }, { s: 'reactor', t: 'medbay' }
        ]
    };

    // --- ДВИЖОК КАРТЫ ---
    const isUnlocked = (node) => !node.req || localStorage.getItem(node.req) === 'true' || localStorage.getItem(node.req) === 'active';

    function buildMap() {
        const svg = document.getElementById('mapLines');
        const nodesContainer = document.getElementById('mapNodes');

        // 1. Отрисовка линий
        MAP_DATA.links.forEach(link => {
            const source = MAP_DATA.nodes.find(n => n.id === link.s);
            const target = MAP_DATA.nodes.find(n => n.id === link.t);
            if (!source || !target) return;

            const active = isUnlocked(source) && isUnlocked(target);
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', active ? 'link-active' : 'link-locked');

            const bgLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            bgLine.setAttribute('x1', source.x); bgLine.setAttribute('y1', source.y);
            bgLine.setAttribute('x2', target.x); bgLine.setAttribute('y2', target.y);
            bgLine.setAttribute('class', 'link-bg');
            g.appendChild(bgLine);

            if (active) {
                const flowLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                flowLine.setAttribute('x1', source.x); flowLine.setAttribute('y1', source.y);
                flowLine.setAttribute('x2', target.x); flowLine.setAttribute('y2', target.y);
                flowLine.setAttribute('class', 'link-flow');
                flowLine.style.animationDelay = `${Math.random() * -20}s`;
                g.appendChild(flowLine);
            }
            svg.appendChild(g);
        });

        // 2. Отрисовка узлов
        MAP_DATA.nodes.forEach(node => {
            const open = isUnlocked(node);
            const el = document.createElement(open ? 'a' : 'div');
            
            if (open) el.href = node.url;
            el.className = `map-node ${open ? 'unlocked' : 'locked'}`;
            el.setAttribute('data-id', node.id);
            el.style.left = `${node.x}px`;
            el.style.top = `${node.y}px`;

            const formattedTitle = node.title.replace(/\n/g, '<br>');
            // Главное изменение: ONLINE зеленый, OFFLINE красный
            const statusText = open ? 'ONLINE' : 'OFFLINE'; 

            el.innerHTML = `
                <div class="node-icon">${node.icon}</div>
                <div class="node-title">${formattedTitle}</div>
                <div class="node-status">${statusText}</div>
            `;
            nodesContainer.appendChild(el);
        });
    }

    // --- КОНСОЛЬ БЫСТРОГО ДОСТУПА (ТИЛЬДА) ---
    const consoleEl = document.getElementById('tilde-console');
    const consoleInput = document.getElementById('console-input');
    const consoleOutput = document.getElementById('console-output');

    // Обработка нажатия клавиш
    document.addEventListener('keydown', (e) => {
        // Открытие/закрытие по ` или Ё/ё
        if (e.key === '`' || e.key === '~' || e.key === 'Ё' || e.key === 'ё') {
            e.preventDefault();
            consoleEl.classList.toggle('active');
            if (consoleEl.classList.contains('active')) {
                consoleInput.focus();
            }
        }
        
        // Закрытие по Escape
        if (e.key === 'Escape' && consoleEl.classList.contains('active')) {
            consoleEl.classList.remove('active');
        }
    });

    // Обработка ввода команды
    consoleInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const cmd = consoleInput.value.trim().toLowerCase();
            consoleInput.value = '';

            // Ищем узел по ID
            const targetNode = MAP_DATA.nodes.find(n => n.id.toLowerCase() === cmd || n.title.toLowerCase().includes(cmd));

            if (!targetNode) {
                consoleOutput.innerHTML += `<div class="err">ОШИБКА: Отсек '${cmd}' не найден в базе данных.</div>`;
                return;
            }

            if (targetNode.req && !isUnlocked(targetNode)) {
                consoleOutput.innerHTML += `<div class="err">ОТКАЗАНО: Доступ к отсеку '${targetNode.title.replace(/\n/g, ' ')}' заблокирован.</div>`;
                return;
            }

            if (targetNode.url === '#') {
                consoleOutput.innerHTML += `<div class="err">ОШИБКА: Модуль '${targetNode.id}' еще не инициализирован.</div>`;
                return;
            }

            // Успешный переход
            consoleOutput.innerHTML += `<div class="ok">УСПЕХ: Инициализация перехода в '${targetNode.title.replace(/\n/g, ' ')}'...</div>`;
            setTimeout(() => { window.location.href = targetNode.url; }, 500);
        }
    });

    // --- ФОН (Звезды) ---
    function initStars() {
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
        window.addEventListener('resize', resize); resize();

        const stars = Array.from({length: 200}, () => ({
            x: Math.random() * width, y: Math.random() * height,
            size: Math.random() * 1.5, alpha: Math.random(), speed: Math.random() * 0.03
        }));

        function draw() {
            ctx.fillStyle = '#010306';
            ctx.fillRect(0, 0, width, height);
            stars.forEach(s => {
                ctx.fillStyle = `rgba(0, 242, 255, ${Math.abs(Math.sin(Date.now() * 0.001 + s.alpha * 10)) * 0.5})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
                s.x -= s.speed; if(s.x < 0) s.x = width;
            });
            requestAnimationFrame(draw);
        }
        draw();
    }

    // Запуск
    buildMap();
    initStars();
</script>
</body>
</html>
