<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<script src="js/auth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИГНАЛ-9 // ТЕЛЕМЕТРИЯ</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="style-tools.css">
    <link rel="stylesheet" type="text/css" href="style-chat-terminal.css">
    <style>
        :root { --warn: #ffaa00; --ok: #00ff44; --err: #ff3333; }
        body.tools-page { 
            overflow: hidden; height: 100vh; background-color: #010306; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0;
            background-image: radial-gradient(circle at center, #03101a 0%, #010306 100%);
            font-family: 'JetBrains Mono', monospace;
        }

        .telemetry-header { 
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 8px; 
            color: var(--neon); text-transform: uppercase; opacity: 0.6; 
            text-shadow: 0 0 20px var(--neon); z-index: 100; pointer-events: none;
        }

        .terminal-wrapper {
            position: relative; width: 600px; height: 500px;
            background: #000; border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0,0,0,1);
            border-radius: 4px; display: flex; flex-direction: column;
            overflow: hidden; z-index: 10; margin-top: 50px;
        }

        .terminal-wrapper::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--neon); z-index: 10; pointer-events: none; opacity: 0.8; }
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .main-layout { display: flex; width: 100%; height: 100%; }
        
        /* Левая часть: Визуал */
        .visual-area { width: 65%; height: 100%; border-right: 1px solid rgba(0, 242, 255, 0.2); position: relative; background: #020508; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #tooltip {
            position: absolute; display: none; background: rgba(0, 10, 15, 0.95);
            border: 1px solid var(--neon); padding: 10px; border-radius: 4px;
            font-size: 11px; pointer-events: none; z-index: 100;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); transform: translate(15px, 15px);
        }
        #tooltip .tt-title { color: var(--neon); font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid rgba(0,242,255,0.3); padding-bottom: 3px; }

        /* Правая часть: Мониторинг */
        .monitor-panel { width: 35%; height: 100%; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; background: rgba(2, 5, 8, 0.9); }
        
        .wave-stats { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .stat-block { border: 1px solid rgba(0, 242, 255, 0.2); padding: 8px; border-radius: 4px; }
        .stat-title { font-size: 10px; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; }
        .stat-row span:last-child { color: var(--neon); }
        
        .log-box { flex-grow: 1; border: 1px solid rgba(0, 242, 255, 0.2); background: rgba(0, 10, 15, 0.8); padding: 8px; font-size: 10px; color: #ccc; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; border-left: 2px solid var(--neon); }
        .log-line { margin-bottom: 2px; flex-shrink: 0; }
        .log-line.ok { color: var(--ok); }
        .log-line.err { color: var(--err); }
        .log-line.warn { color: var(--warn); }

        .terminal-hint { position: absolute; bottom: 10px; right: 15px; color: #555; font-size: 9px; letter-spacing: 1px; z-index: 100; }
        .wave-btn { cursor: pointer; user-select: none; transition: 0.3s; }
        .wave-btn:hover { filter: brightness(1.2); text-shadow: 0 0 8px currentColor; }
        .wave-btn.hidden-wave { opacity: 0.3; text-shadow: none !important; }		
    </style>
</head>
<body class="tools-page">

    <div class="chat-system">
        <div id="quest-field" class="question" onclick="handleChatClick()"></div>
        <div id="answer-field" class="answer-field"></div>
    </div>

    <canvas id="starfield"></canvas>
    <div id="scanner-line"></div>
    <div id="overlay-noise"></div>

    <div class="telemetry-header">СИСТЕМА ТЕЛЕМЕТРИИ // СЕКТОР 02</div>
    
    <div class="terminal-wrapper">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div>
        
        <div class="main-layout">
            <div class="visual-area" id="visualArea">
                <canvas id="canvas" width="390" height="500"></canvas>
            </div>
            
            <div class="monitor-panel">
                <div class="wave-stats">
                    <div class="stat-block">
                        <div class="stat-title wave-btn" id="btn-red" style="color: #ff3333;">RED WAVE</div>
                        <div class="stat-row"><span>FREQ:</span> <span id="ui-red-freq">30</span></div>
                        <div class="stat-row"><span>PHASE:</span> <span id="ui-red-phase">45</span></div>
                        <div class="stat-row"><span>AMP:</span> <span id="ui-red-amp">60</span></div>
                        <div class="stat-row"><span>OFFSET:</span> <span id="ui-red-offset">0</span></div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-title wave-btn" id="btn-green" style="color: #00ff44;">GREEN WAVE</div>
                        <div class="stat-row"><span>FREQ:</span> <span id="ui-green-freq">30</span></div>
                        <div class="stat-row"><span>PHASE:</span> <span id="ui-green-phase">0</span></div>
                        <div class="stat-row"><span>AMP:</span> <span id="ui-green-amp">100</span></div>
                        <div class="stat-row"><span>OFFSET:</span> <span id="ui-green-offset">-20</span></div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-title wave-btn" id="btn-blue" style="color: #00aaff;">BLUE WAVE</div>
                        <div class="stat-row"><span>FREQ:</span> <span id="ui-blue-freq">30</span></div>
                        <div class="stat-row"><span>PHASE:</span> <span id="ui-blue-phase">120</span></div>
                        <div class="stat-row"><span>AMP:</span> <span id="ui-blue-amp">40</span></div>
                        <div class="stat-row"><span>OFFSET:</span> <span id="ui-blue-offset">20</span></div>
                    </div>
                </div>
                <div class="log-box" id="logBox"></div>
            </div>
        </div>
    </div>

    <div class="audio-control-fixed" id="audio-toggle">
        <span id="audio-status-icon">○</span>
        <span id="audio-status">АУДИОДАТЧИКИ: ВЫКЛ</span>
    </div>

    <button id="console-toggle-btn" style="position: fixed; bottom: 25px; right: 25px; z-index: 100000; background: rgba(0, 20, 30, 0.5); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); padding: 8px 12px; font-family: monospace; font-size: 14px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(0, 242, 255, 0.1)'" onmouseout="this.style.background='rgba(0, 20, 30, 0.5)'">&gt;_</button>

    <script src="js/loader.js"></script>
    <script src="js/telemetry.js"></script>
</body>
</html>
